{
  "$schema": "https://railway.com/railway.schema.json",
  "build": {
    "builder": "NIXPACKS",
    "buildCommand": "npm install && npm run db:generate && npm run build:api"
  },
  "deploy": {
    "startCommand": "npm run start -w @pay3/api",
    "healthcheckPath": "/health",
    "restartPolicyType": "ON_FAILURE"
  }
}
